spring:
  application:
    name: blog-backend
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:blog}
    username: ${DB_USER:blog}
    password: ${DB_PASSWORD:blog}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      repositories:
        enabled: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        boot.allow_jdbc_metadata_access: false
  flyway:
    enabled: false
    locations: classpath:db/migration
  session:
    timeout: 30m

blog:
  post:
    repository-type: in-memory
  auth:
    repository-type: in-memory
  taxonomy:
    repository-type: in-memory
    default-admin-email: ${ADMIN_EMAIL:admin@blog.com}
    default-admin-password: ${ADMIN_PASSWORD:admin123}
    default-admin-name: ${ADMIN_NAME:Admin}
    max-login-attempts: ${MAX_LOGIN_ATTEMPTS:5}
    lock-duration-minutes: ${LOCK_DURATION_MINUTES:15}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  media:
    upload-dir: ${MEDIA_UPLOAD_DIR:./uploads}
    url-prefix: ${MEDIA_URL_PREFIX:/uploads/}
    max-image-size: ${MEDIA_MAX_IMAGE_SIZE:10485760}
  import:
    max-file-size: ${IMPORT_MAX_FILE_SIZE:2097152}

server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
