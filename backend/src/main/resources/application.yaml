spring:
  application:
    name: blog-backend
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:blog}
    username: ${DB_USER:blog}
    password: ${DB_PASSWORD:blog}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      repositories:
        enabled: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        boot.allow_jdbc_metadata_access: false
  flyway:
    enabled: false
    locations: classpath:db/migration
  mvc:
    async:
      request-timeout: 120000
  session:
    timeout: 30m
  lifecycle:
    timeout-per-shutdown-phase: 30s

blog:
  post:
    repository-type: in-memory
  auth:
    repository-type: in-memory
    default-admin-email: ${ADMIN_EMAIL:admin@blog.com}
    default-admin-password: ${ADMIN_PASSWORD:admin123}
    default-admin-name: ${ADMIN_NAME:Admin}
    public-site-url: ${PUBLIC_SITE_URL:http://localhost:3000}
    reset-token-ttl-minutes: ${RESET_TOKEN_TTL_MINUTES:120}
    max-login-attempts: ${MAX_LOGIN_ATTEMPTS:5}
    lock-duration-minutes: ${LOCK_DURATION_MINUTES:15}
  taxonomy:
    repository-type: in-memory
  site:
    repository-type: in-memory
  comment:
    repository-type: in-memory
    max-per-window: 5
    window-minutes: 10
  ai:
    base-url: ${AI_BASE_URL:http://localhost:8090}
    api-key: ${AI_API_KEY:dev-agent-key}
    project-id: ${AI_PROJECT_ID:blog}
    repository-type: in-memory
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  media:
    storage-type: ${MEDIA_STORAGE_TYPE:local}
    upload-dir: ${MEDIA_UPLOAD_DIR:./uploads}
    url-prefix: ${MEDIA_URL_PREFIX:/uploads/}
    max-image-size: ${MEDIA_MAX_IMAGE_SIZE:10485760}
    s3:
      endpoint: ${S3_ENDPOINT:http://localhost:9000}
      region: ${S3_REGION:us-east-1}
      bucket: ${S3_BUCKET:blog-media}
      access-key: ${S3_ACCESS_KEY:minio}
      secret-key: ${S3_SECRET_KEY:minioadmin}
  import:
    max-file-size: ${IMPORT_MAX_FILE_SIZE:2097152}

server:
  shutdown: graceful
  servlet:
    session:
      timeout: 7d
      cookie:
        http-only: true
        same-site: lax
        secure: false
        path: /
        max-age: 7d

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
